<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tembusu — Singapore Botanic Gardens</title>
  <meta name="description" content="A house of stories taking root. A straits dining house at Singapore Botanic Gardens. Opening soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mukta+Mahee:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="version-b">
  <!-- Video Background -->
  <div class="video-bg">
    <video autoplay muted loop playsinline id="bgVideo" class="desktop-video">
      <source src="assets/brand-video.mp4" type="video/mp4">
    </video>
    <video autoplay muted loop playsinline id="bgVideoMobile" class="mobile-video">
      <source src="assets/brand-video-mobile.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Navigation -->
  <nav class="landing-nav dark">
    <a href="/" class="nav-logo">
      <img src="assets/logo.png" alt="Tembusu" style="filter: brightness(0) invert(1);">
    </a>
    <div class="nav-right">
      <span class="nav-status">OPENING SOON</span>
      <a href="#signup-video" class="nav-cta light">JOIN UPDATES</a>
    </div>
  </nav>

  <!-- Hero Content -->
  <section class="hero-video">
    <div class="hero-video-content">
      <h1 class="hero-headline-video">
        A house of<br>stories<br><em>taking root.</em>
      </h1>
      <p class="hero-subtitle-video">A straits dining house at Singapore Botanic Gardens.<br><em>Opening soon.</em></p>
      
      <form id="signup-video" class="signup-form dark" onsubmit="handleSignup(event)">
        <div class="form-row">
          <input type="text" name="contact" placeholder="Email or WhatsApp number" required class="signup-input dark">
          <button type="submit" class="signup-btn dark">NOTIFY ME</button>
        </div>
        <p class="form-note light">Opening updates only.</p>
        <p class="form-success light" id="successMsgVideo" style="display:none;">Thank you! We'll be in touch.</p>
      </form>


    </div>
  </section>

  <!-- Fixed floral accents -->
  <img src="assets/orchid.png" alt="" class="deco-orchid" aria-hidden="true">
  <img src="assets/bird-paradise.png" alt="" class="deco-bird" aria-hidden="true">

  <!-- Social Footer -->
  <footer class="landing-footer social-footer">
    <div class="social-links">
      <span class="social-label">Follow us</span>
      <a href="https://www.instagram.com/tembususg?igsh=MWM4cHk4ZXRzbWc3bA==" target="_blank" rel="noopener" class="social-link" aria-label="Instagram">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
        <span>Instagram</span>
      </a>
      <a href="https://vt.tiktok.com/ZSX2AMop8/" target="_blank" rel="noopener" class="social-link" aria-label="TikTok">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.52a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.34-6.34V8.98a8.18 8.18 0 004.76 1.52V7.05a4.84 4.84 0 01-1-.36z"/>
        </svg>
        <span>TikTok</span>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
